<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-labelledby="title desc"><title id="title">National Insurance thresholds and rates for 2026/27</title><desc id="desc">A mobile three-step National Insurance threshold diagram. Employee NI is zero to £12,570, 8 percent to £50,270 and 2 percent above. Employer NI is zero to £5,000 and 15 percent above with no upper limit. Self-employed Class 4 NI is zero to £12,570, 6 percent to £50,270 and 2 percent above.</desc><rect width="360" height="430" fill="#fff"/><g font-family="Arial, sans-serif"><text x="20" y="31" fill="#0f172a" font-size="18" font-weight="700">2026/27 NI bands</text><text x="20" y="51" fill="#64748b" font-size="12">Standard annual rates and thresholds</text><g fill="#f8fafc" stroke="#e2e8f0"><rect x="16" y="70" width="328" height="102" rx="10"/><rect x="16" y="186" width="328" height="102" rx="10"/><rect x="16" y="302" width="328" height="112" rx="10"/></g><g fill="#0f172a" font-size="15" font-weight="700"><text x="32" y="98">Employee</text><text x="32" y="214">Employer</text><text x="32" y="330">Self-employed</text></g><g fill="#64748b" font-size="12"><text x="32" y="118">Class 1 primary</text><text x="32" y="234">Class 1 secondary</text><text x="32" y="350">Class 4</text></g><g font-size="12"><g fill="#334155"><text x="151" y="98">£0–£12,570: no NI</text><text x="151" y="214">£0–£5,000: no NI</text><text x="151" y="330">£0–£12,570: no NI</text></g><g fill="#047857" font-weight="700"><text x="151" y="121">£12,570–£50,270: 8%</text><text x="151" y="237">Above £5,000: 15%</text><text x="151" y="353">£12,570–£50,270: 6%</text></g><g fill="#0f766e" font-weight="700"><text x="151" y="144">Above £50,270: 2%</text><text x="151" y="376">Above £50,270: 2%</text></g></g><g fill="#64748b" font-size="11"><text x="32" y="161">Primary Threshold</text><text x="32" y="277">Secondary Threshold · no upper limit</text><text x="32" y="403">Lower Profits Limit</text></g></g></svg>
