<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc">
  <title id="title">The statutory cost of a £30,000 employee</title>
  <desc id="desc">A £30,000 salary plus £3,750 employer National Insurance and £712.80 employer pension gives a total employment cost of £34,462.80.</desc>
  <rect width="720" height="230" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="38" y="34" font-size="13" font-weight="600" fill="#64748b">Total employment cost</text><text x="682" y="34" text-anchor="end" font-size="24" font-weight="700" fill="#0f172a">£34,462.80</text><rect x="38" y="62" width="538" height="58" rx="5" fill="#0f172a"/><rect x="576" y="62" width="67" height="58" rx="5" fill="#047857"/><rect x="643" y="62" width="13" height="58" rx="5" fill="#f59e0b"/><text x="307" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">£30,000.00</text><text x="38" y="154" font-size="13" font-weight="700" fill="#0f172a">Gross salary · £30,000.00</text><text x="38" y="174" font-size="12" fill="#64748b">Contractual cash pay</text><text x="310" y="154" font-size="13" font-weight="700" fill="#0f172a">Employer NI · £3,750.00</text><text x="290" y="174" font-size="12" fill="#64748b">15% above £5,000</text><text x="510" y="154" font-size="13" font-weight="700" fill="#0f172a">Pension · £712.80</text><text x="510" y="174" font-size="12" fill="#64748b">3% qualifying earnings</text></g>
</svg>
