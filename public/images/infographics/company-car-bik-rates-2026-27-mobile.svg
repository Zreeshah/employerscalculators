<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">CO₂ emissions and company-car BIK rates</title>
  <desc id="desc">Illustrative 2026/27 benefit-in-kind rates: electric 4 percent, plug-in hybrid 4 to 16 percent, petrol 30 percent, and high-emission cars 37 percent.</desc>
  <rect width="360" height="260" fill="#ffffff"/>
  <g font-family="Arial, sans-serif"><rect x="12" y="14" width="162" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="26" y="44" font-size="14" font-weight="700" fill="#0f172a">Electric</text><text x="26" y="76" font-size="28" font-weight="700" fill="#047857">4%</text><text x="26" y="100" font-size="13" fill="#64748b">0g/km</text><rect x="186" y="14" width="162" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="200" y="44" font-size="14" font-weight="700" fill="#0f172a">PHEV</text><text x="200" y="76" font-size="28" font-weight="700" fill="#047857">4–16%</text><text x="200" y="100" font-size="13" fill="#64748b">1–50g/km</text><rect x="12" y="132" width="162" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="26" y="162" font-size="14" font-weight="700" fill="#0f172a">Petrol</text><text x="26" y="194" font-size="28" font-weight="700" fill="#b45309">30%</text><text x="26" y="218" font-size="13" fill="#64748b">120–124g/km</text><rect x="186" y="132" width="162" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="200" y="162" font-size="14" font-weight="700" fill="#0f172a">High emission</text><text x="200" y="194" font-size="28" font-weight="700" fill="#0f172a">37%</text><text x="200" y="218" font-size="13" fill="#64748b">150g/km+</text></g>
</svg>
