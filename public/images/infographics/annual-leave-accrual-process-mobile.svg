<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Annual leave accrual and balance process</title><desc id="desc">Four annual leave steps: start the leave year, set entitlement, track accrual and plan the balance.</desc><rect width="360" height="360" fill="#fff"/><g font-family="Arial, sans-serif"><path d="M34 58V303" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 7"/><g fill="#047857"><circle cx="34" cy="58" r="17"/><circle cx="34" cy="140" r="17"/><circle cx="34" cy="222" r="17"/><circle cx="34" cy="304" r="17"/></g><g fill="#fff" font-size="12" font-weight="700" text-anchor="middle"><text x="34" y="63">1</text><text x="34" y="145">2</text><text x="34" y="227">3</text><text x="34" y="309">4</text></g><g fill="#f8fafc" stroke="#e2e8f0"><rect x="66" y="22" width="278" height="72" rx="10"/><rect x="66" y="104" width="278" height="72" rx="10"/><rect x="66" y="186" width="278" height="72" rx="10"/><rect x="66" y="268" width="278" height="72" rx="10"/></g><g fill="#0f172a" font-size="14" font-weight="700"><text x="82" y="50">Start leave year</text><text x="82" y="132">Set entitlement</text><text x="82" y="214">Track accrual</text><text x="82" y="296">Plan balance</text></g><g fill="#64748b" font-size="12"><text x="82" y="74">Employer's 12-month leave period</text><text x="82" y="156">Statutory or contractual days and rules</text><text x="82" y="238">Includes sickness and family leave</text><text x="82" y="320">Taken, booked and carry-over check</text></g></g></svg>
