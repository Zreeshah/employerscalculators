<svg xmlns="http://www.w3.org/2000/svg" width="720" height="254" viewBox="0 0 720 254" role="img" aria-labelledby="title desc">
  <title id="title">Qualifying earnings versus total salary</title>
  <desc id="desc">On a £35,000 salary, qualifying earnings of £28,760 produce £2,300.80 total minimum pension contributions. Applying the same percentages to the full salary produces £2,800.</desc>
  <rect width="720" height="254" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="38" y="34" font-size="14" font-weight="700" fill="#0f172a">Qualifying earnings basis</text><text x="682" y="34" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">£28,760 pensionable</text><rect x="38" y="51" width="620" height="36" rx="6" fill="#e2e8f0"/><rect x="148" y="51" width="510" height="36" rx="6" fill="#047857"/><text x="403" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3% employer + 5% employee = £2,300.80</text><text x="38" y="108" font-size="12" fill="#64748b">£6,240 lower threshold excluded</text><text x="38" y="153" font-size="14" font-weight="700" fill="#0f172a">Total earnings basis</text><text x="682" y="153" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">£35,000 pensionable</text><rect x="38" y="170" width="620" height="36" rx="6" fill="#0f172a"/><text x="348" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3% employer + 5% employee = £2,800.00</text><text x="38" y="238" font-size="13" font-weight="700" fill="#047857">Difference: £499.20 a year</text></g>
</svg>
