<svg xmlns="http://www.w3.org/2000/svg" width="360" height="258" viewBox="0 0 360 258" role="img" aria-labelledby="title desc">
  <title id="title">The statutory cost of a £30,000 employee</title>
  <desc id="desc">A £30,000 salary, £3,750 employer National Insurance and £712.80 employer pension total £34,462.80.</desc>
  <rect width="360" height="258" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="18" y="32" font-size="13" font-weight="600" fill="#64748b">Total employment cost</text><text x="18" y="62" font-size="27" font-weight="700" fill="#0f172a">£34,462.80</text><rect x="18" y="82" width="324" height="12" rx="4" fill="#0f172a"/><rect x="301" y="82" width="35" height="12" rx="4" fill="#047857"/><rect x="336" y="82" width="6" height="12" rx="4" fill="#f59e0b"/><rect x="18" y="112" width="324" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="30" y="136" font-size="14" font-weight="700" fill="#0f172a">Gross salary</text><text x="330" y="136" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">£30,000.00</text><rect x="18" y="162" width="324" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="30" y="186" font-size="14" font-weight="700" fill="#0f172a">Employer NI</text><text x="330" y="186" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">£3,750.00</text><rect x="18" y="212" width="324" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="30" y="236" font-size="14" font-weight="700" fill="#0f172a">Employer pension</text><text x="330" y="236" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">£712.80</text></g>
</svg>
