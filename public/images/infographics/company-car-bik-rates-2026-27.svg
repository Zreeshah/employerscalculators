<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">CO₂ emissions and company-car BIK rates</title>
  <desc id="desc">Illustrative 2026/27 benefit-in-kind rates rise from 4 percent for electric cars to 37 percent for high-emission cars.</desc>
  <rect width="720" height="300" fill="#ffffff"/>
  <line x1="42" y1="248" x2="692" y2="248" stroke="#0f172a" stroke-opacity=".16"/>
  <rect x="64" y="206" width="112" height="42" rx="10" fill="#047857"/><text x="120" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">4%</text><text x="120" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Electric</text><text x="120" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">0g/km</text>
  <rect x="228" y="152" width="112" height="96" rx="10" fill="#0e9f6e"/><text x="284" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">4–16%</text><text x="284" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">PHEV</text><text x="284" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">1–50g/km</text>
  <rect x="392" y="68" width="112" height="180" rx="10" fill="#f59e0b"/><text x="448" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">30%</text><text x="448" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Petrol</text><text x="448" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">120–124g/km</text>
  <rect x="556" y="26" width="112" height="222" rx="10" fill="#0f172a"/><text x="612" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">37%</text><text x="612" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">High emission</text><text x="612" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">150g/km+</text>
</svg>
