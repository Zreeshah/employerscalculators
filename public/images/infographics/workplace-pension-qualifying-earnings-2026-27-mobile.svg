<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img" aria-labelledby="title desc">
  <title id="title">Qualifying earnings versus total salary</title>
  <desc id="desc">A £35,000 salary has £28,760 qualifying earnings after the lower threshold. Contributions are £2,300.80 on qualifying earnings or £2,800 on total earnings.</desc>
  <rect width="360" height="270" fill="#ffffff"/><g font-family="Arial, sans-serif"><rect x="14" y="14" width="332" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="28" y="43" font-size="14" font-weight="700" fill="#0f172a">Qualifying earnings</text><text x="332" y="43" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">£28,760</text><text x="28" y="75" font-size="22" font-weight="700" fill="#047857">£2,300.80</text><text x="28" y="101" font-size="13" fill="#64748b">£6,240 lower threshold excluded</text><rect x="14" y="132" width="332" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="28" y="161" font-size="14" font-weight="700" fill="#0f172a">Total earnings</text><text x="332" y="161" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">£35,000</text><text x="28" y="198" font-size="22" font-weight="700" fill="#0f172a">£2,800.00</text><text x="14" y="252" font-size="15" font-weight="700" fill="#047857">Difference: £499.20 a year</text></g>
</svg>
