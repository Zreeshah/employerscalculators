<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">Company sick-pay payroll process</title><desc id="desc">A four-step company sick-pay process: record absence, check Statutory Sick Pay eligibility, apply the contractual policy and process payment and return-to-work actions.</desc><rect width="720" height="280" fill="#fff"/><g font-family="Arial, sans-serif"><path d="M120 83H600" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 7"/><g fill="#047857"><circle cx="120" cy="83" r="25"/><circle cx="280" cy="83" r="25"/><circle cx="440" cy="83" r="25"/><circle cx="600" cy="83" r="25"/></g><g fill="#fff" font-size="15" font-weight="700" text-anchor="middle"><text x="120" y="89">1</text><text x="280" y="89">2</text><text x="440" y="89">3</text><text x="600" y="89">4</text></g><g fill="#f8fafc" stroke="#e2e8f0"><rect x="36" y="126" width="168" height="114" rx="10"/><rect x="196" y="126" width="168" height="114" rx="10"/><rect x="356" y="126" width="168" height="114" rx="10"/><rect x="516" y="126" width="168" height="114" rx="10"/></g><g fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle"><text x="120" y="157">Record absence</text><text x="280" y="157">Check SSP floor</text><text x="440" y="157">Apply contract</text><text x="600" y="157">Payroll and review</text></g><g fill="#64748b" font-size="12" text-anchor="middle"><text x="120" y="183">Dates, qualifying days</text><text x="120" y="201">and evidence record</text><text x="280" y="183">PIW, eligibility and</text><text x="280" y="201">SSP already used</text><text x="440" y="183">Full pay, half pay or</text><text x="440" y="201">SSP-only policy stages</text><text x="600" y="183">Pay, SSP1 if needed and</text><text x="600" y="201">return-to-work actions</text></g></g></svg>
