<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Statutory Sick Pay process</title><desc id="desc">Four 2026/27 Statutory Sick Pay steps: record sickness, check eligibility, calculate the rate and pay SSP.</desc><rect width="360" height="360" fill="#fff"/><g font-family="Arial, sans-serif"><path d="M34 58V303" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 7"/><g fill="#047857"><circle cx="34" cy="58" r="17"/><circle cx="34" cy="140" r="17"/><circle cx="34" cy="222" r="17"/><circle cx="34" cy="304" r="17"/></g><g fill="#fff" font-size="12" font-weight="700" text-anchor="middle"><text x="34" y="63">1</text><text x="34" y="145">2</text><text x="34" y="227">3</text><text x="34" y="309">4</text></g><g fill="#f8fafc" stroke="#e2e8f0"><rect x="66" y="22" width="278" height="72" rx="10"/><rect x="66" y="104" width="278" height="72" rx="10"/><rect x="66" y="186" width="278" height="72" rx="10"/><rect x="66" y="268" width="278" height="72" rx="10"/></g><g fill="#0f172a" font-size="14" font-weight="700"><text x="82" y="50">Record sickness</text><text x="82" y="132">Check eligibility</text><text x="82" y="214">Set daily rate</text><text x="82" y="296">Pay SSP</text></g><g fill="#64748b" font-size="12"><text x="82" y="74">4-day PIW including non-work days</text><text x="82" y="156">Employee, notice and earnings conditions</text><text x="82" y="238">Lower of £123.25 or 80% AWE ÷ work days</text><text x="82" y="320">First qualifying day, up to 28 weeks</text></g></g></svg>
