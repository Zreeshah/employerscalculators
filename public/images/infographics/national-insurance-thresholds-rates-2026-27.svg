<svg xmlns="http://www.w3.org/2000/svg" width="720" height="338" viewBox="0 0 720 338" role="img" aria-labelledby="title desc"><title id="title">National Insurance thresholds and rates for 2026/27</title><desc id="desc">A three-row diagram showing standard National Insurance bands. Employee National Insurance is zero to £12,570, 8 percent to £50,270 and 2 percent above. Employer National Insurance is zero to £5,000 and 15 percent above with no upper limit. Self-employed Class 4 National Insurance is zero to £12,570, 6 percent to £50,270 and 2 percent above.</desc><rect width="720" height="338" fill="#fff"/><g font-family="Arial, sans-serif"><text x="32" y="38" fill="#0f172a" font-size="21" font-weight="700">2026/27 National Insurance thresholds and rates</text><text x="32" y="61" fill="#64748b" font-size="13">Standard annual bands for employee, employer and self-employed NI</text><g fill="#f8fafc" stroke="#e2e8f0"><rect x="24" y="84" width="672" height="66" rx="10"/><rect x="24" y="164" width="672" height="66" rx="10"/><rect x="24" y="244" width="672" height="66" rx="10"/></g><g fill="#0f172a" font-size="14" font-weight="700"><text x="40" y="112">Employee</text><text x="40" y="192">Employer</text><text x="40" y="272">Self-employed</text></g><g fill="#64748b" font-size="12"><text x="40" y="131">Class 1 primary</text><text x="40" y="211">Class 1 secondary</text><text x="40" y="291">Class 4</text></g><g><rect x="178" y="101" width="132" height="32" rx="5" fill="#e2e8f0"/><rect x="314" y="101" width="202" height="32" rx="5" fill="#047857"/><rect x="520" y="101" width="160" height="32" rx="5" fill="#0f766e"/><rect x="178" y="181" width="72" height="32" rx="5" fill="#e2e8f0"/><rect x="254" y="181" width="426" height="32" rx="5" fill="#047857"/><rect x="178" y="261" width="132" height="32" rx="5" fill="#e2e8f0"/><rect x="314" y="261" width="202" height="32" rx="5" fill="#0f766e"/><rect x="520" y="261" width="160" height="32" rx="5" fill="#0f766e"/></g><g font-size="12" text-anchor="middle"><g fill="#334155"><text x="244" y="121">£0–£12,570</text><text x="214" y="201">£0–£5,000</text><text x="244" y="281">£0–£12,570</text></g><g fill="#fff" font-weight="700"><text x="415" y="121">8% to £50,270</text><text x="600" y="121">2% above</text><text x="467" y="201">15% above £5,000</text><text x="415" y="281">6% to £50,270</text><text x="600" y="281">2% above</text></g></g><g fill="#64748b" font-size="11"><text x="178" y="146">No employee NI</text><text x="178" y="226">No employer NI</text><text x="178" y="306">No Class 4 NI</text><text x="566" y="226">No upper limit</text></g></g></svg>
